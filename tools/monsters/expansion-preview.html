<!doctype html><html><meta charset="utf-8"><title>Monster Expansion 1.2</title><style>html,body{margin:0;background:#111a20;color:#ebdfc9;font:15px system-ui}canvas{width:100vw;height:100vh;display:block}#labels{position:fixed;inset:0;pointer-events:none}.label{position:absolute;text-align:center;white-space:pre-line;text-shadow:0 2px 4px #000;font-weight:700}</style><canvas></canvas><div id="labels"></div><script type="module">
import {Engine,Scene,ArcRotateCamera,Vector3,HemisphericLight,DirectionalLight,LoadAssetContainerAsync,MeshBuilder,StandardMaterial,Color3}from'@babylonjs/core';import'@babylonjs/loaders/glTF';
import{BackActor}from'/src/minigames/backrooms/backroomsAssets.ts';import{MONSTER_PROFILES,loadMonsterManifest}from'/src/monsters/MonsterAnimator.ts';
const trial=new URLSearchParams(location.search).has('trial'),engine=new Engine(document.querySelector('canvas'),true,{preserveDrawingBuffer:true}),scene=new Scene(engine),cam=new ArcRotateCamera('inspection',-Math.PI/2,1.47,35,new Vector3(0,2.3,0),scene);scene.clearColor.set(.055,.075,.09,1);cam.mode=1;cam.orthoLeft=-17;cam.orthoRight=17;cam.orthoTop=9.56;cam.orthoBottom=-9.56;new HemisphericLight('fill',new Vector3(0,1,.3),scene).intensity=1.1;new DirectionalLight('key',new Vector3(-.2,-1,-1),scene).intensity=1.05;
await loadMonsterManifest();const assets={scene,containers:new Map()},actors=[],kinds=['warrok','zombiegirl','yaku','pumpkinhulk'];
for(const kind of kinds)assets.containers.set(kind,await LoadAssetContainerAsync(trial?'/docs/agent-work/monster-expansion/'+kind+'-trial.glb':MONSTER_PROFILES[kind].model,scene));
const requested=trial?['WALK','SWIPE','JUMP_ATTACK']:['IDLE','WALK','RUN','SWIPE','DEATH'];
for(const[row,kind]of kinds.entries())for(const[col,state]of requested.entries()){
 const a=new BackActor(assets,kind,kind+':'+state,undefined,undefined,true);if(!a.animator.clips.has(state)){a.dispose();continue;}const x=(col-(requested.length-1)/2)*6,y=(1.5-row)*4.4;actors.push({actor:a,state,x,y});const label=document.createElement('div');label.className='label';label.textContent=kind.toUpperCase()+' · '+state;label.style.cssText=`left:${(x+17)/34*100-8}%;width:16%;top:${(2.3-y+9.56)/19.12*100-8}%`;document.querySelector('#labels').append(label);
}
window.expansion={engine,scene,assets,actors,phase:.35,freeze:false,age:0};engine.runRenderLoop(()=>{const w=window.expansion,dt=Math.min(.1,engine.getDeltaTime()/1000);w.age+=w.freeze?0:dt;for(const a of actors){const c=a.actor.animator.clips.get(a.state),age=w.freeze?w.phase*c.duration:w.age%c.duration;a.actor.setAnimation(a.state,age);a.actor.update(a.x,0,Math.PI,1.5,a.state==='RUN',w.age,dt);a.actor.root.position.y=a.y;}scene.render();});
</script></html>
