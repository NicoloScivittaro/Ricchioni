<!doctype html><html lang="it"><meta charset="utf-8"><title>Backrooms 2.0 · Nightmare</title><body style="margin:0;background:#0b0b09"><canvas id="c" style="display:block;width:100vw;height:100vh"></canvas><script type="module">
import{BabylonBackroomsGame}from'/src/minigames/backrooms/BabylonBackroomsGame.ts';import{InputManager}from'/src/network/InputManager.ts';import{Rng}from'/shared/rng.ts';
window.start=async(count=5)=>{window.game?.dispose();const input=new InputManager(),players=Array.from({length:count},(_,i)=>({id:'p'+i,name:['Niko','Boschi','Ciro','Dottore','Judoka'][i],displayName:['Niko','Boschi','Ciro','Dottore','Judoka'][i],color:['#e9bd55','#ca6254','#6fae8e','#83a5c0','#b28ac5'][i],characterId:['goblin','judoka','ciro','dottore','boschi'][i],bot:false,score:0,roleTitle:'',avatar:'',quote:''}));const ctx={players,playerIds:players.map(p=>p.id),mapId:'lobby',rng:new Rng(777),durationSec:420,modifier:null,modifiers:new Map(),input,consume:()=>false,signal:()=>{},sendPrivate:()=>{},vibrate:()=>{},finish:r=>window.results=r,showControls:async()=>{}};window.input=input;window.game=new BabylonBackroomsGame(document.getElementById('c'),ctx);await window.game.ready;window.ready=true;return{models:[...window.game.assets.containers.keys()],actors:window.game.entities.size,cameras:window.game.cameras.length,seed:window.game.match.maze.seed,types:window.game.match.monsters.map(m=>m.kind)};};window.ready=false;
window.addEventListener('keydown',e=>{if(e.code==='KeyF')input.handle('p0',{kind:'action',controlId:'flashlight'});if(e.code==='KeyE')input.handle('p0',{kind:'action',controlId:'interact'});});
await window.start(Number(new URLSearchParams(location.search).get('players')??5));
</script></body></html>
