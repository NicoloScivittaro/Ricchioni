<!doctype html><html><body style="margin:0;background:#111"><canvas id="c" style="display:block;width:100vw;height:100vh"></canvas><script type="module">
import {Engine,Scene,ArcRotateCamera,HemisphericLight,Vector3,LoadAssetContainerAsync,Color4} from '@babylonjs/core';import '@babylonjs/loaders/glTF';const e=new Engine(document.getElementById('c'),true),s=new Scene(e);s.clearColor=new Color4(.13,.14,.11,1);const cam=new ArcRotateCamera('cam',-.9,1.1,6,Vector3.Zero(),s);cam.attachControl();cam.minZ=.01;cam.maxZ=3000;new HemisphericLight('light',new Vector3(.5,1,.2),s).intensity=1.1;
window.load=async file=>{for(const n of [...s.rootNodes])if(!['cam','light'].includes(n.name))n.dispose();const a=await LoadAssetContainerAsync('/assets/backrooms/'+file+'.glb',s);a.addAllToScene();const meshes=a.meshes.filter(m=>m.getTotalVertices());let min=new Vector3(Infinity,Infinity,Infinity),max=min.negate();for(const m of meshes){m.computeWorldMatrix(true);const b=m.getBoundingInfo().boundingBox;min=Vector3.Minimize(min,b.minimumWorld);max=Vector3.Maximize(max,b.maximumWorld);}cam.target=min.add(max).scale(.5);cam.radius=Vector3.Distance(min,max)*.95;return {min:min.asArray(),max:max.asArray(),meshes:meshes.map(m=>({name:m.name,verts:m.getTotalVertices(),mat:m.material?.name,bounds:[m.getBoundingInfo().boundingBox.minimumWorld.asArray(),m.getBoundingInfo().boundingBox.maximumWorld.asArray()]})),bones:a.skeletons.map(sk=>sk.bones.map(b=>({name:b.name,node:b.getTransformNode()?.name})))}};e.runRenderLoop(()=>s.render());
</script></body></html>
