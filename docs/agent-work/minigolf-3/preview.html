<!doctype html><html lang="it"><meta charset="utf-8"><title>Minigolf · Club sul mare</title><style>body{margin:0;background:#b4d0d7;font:14px system-ui}canvas{width:100vw;height:100vh;display:block}nav{position:absolute;top:18px;left:18px;display:flex;gap:10px;align-items:center;padding:12px 16px;border:1px solid #ffffff77;border-radius:14px;background:#143d37e8;color:#ffedce;box-shadow:0 8px 30px #14352d44}button,select{padding:9px 12px;border:0;border-radius:7px;background:#ede4ce;color:#203a32;font-weight:700}label{display:flex;align-items:center;gap:8px}#readout{position:absolute;bottom:18px;left:18px;background:#143d37dd;color:#fff1d8;border-radius:10px;padding:12px 18px}</style><canvas id="c"></canvas><nav><b>CLUB SUL MARE</b><select id="map"></select><button id="overview">Panoramica</button><button id="near">Vicino alla pallina</button><label>Forza <input id="power" type="range" min="0" max="100" value="100"></label><button id="shot">Tira</button><button id="reset">Riparti</button></nav><div id="readout"></div><script type="module">
import {Engine,Scene,ArcRotateCamera,HemisphericLight,DirectionalLight,ShadowGenerator,Vector3,Color3,Color4} from '@babylonjs/core';
import {MinigolfVisuals} from '/src/minigames/minigolf/minigolfVisuals.ts';
import {buildGolfClub} from '/src/minigames/minigolf/minigolfArt.ts';
import {MinigolfMatch} from '/src/minigames/minigolf/minigolfRules.ts';
import {COURSES} from '/src/minigames/minigolf/minigolfCourses.ts';
import {impulse,physicsStep,speed,resetBallToTee} from '/src/minigames/minigolf/minigolfPhysics.ts';
const e=new Engine(document.getElementById('c'),true),s=new Scene(e);s.clearColor=new Color4(.73,.84,.88,1);s.ambientColor=new Color3(.035,.045,.045);const cam=new ArcRotateCamera('overview',-Math.PI/2,.65,65,new Vector3(0,0,1),s);cam.attachControl();cam.minZ=.04;cam.maxZ=250;const sky=new HemisphericLight('sky',new Vector3(0,1,0),s);sky.intensity=.68;sky.groundColor=new Color3(.24,.28,.23);sky.diffuse=new Color3(.88,.95,1);const sun=new DirectionalLight('sun',new Vector3(-.4,-1,.4),s);sun.position.set(8,25,-12);sun.intensity=1.05;sun.diffuse=new Color3(1,.94,.81);sun.shadowMinZ=1;sun.shadowMaxZ=110;sun.autoCalcShadowZBounds=true;const shadow=new ShadowGenerator(1024,sun);shadow.usePercentageCloserFiltering=true;shadow.filteringQuality=ShadowGenerator.QUALITY_MEDIUM;shadow.bias=.0008;shadow.normalBias=.025;shadow.setDarkness(.2);
buildGolfClub(s);let match,visual,time=0,peak=0;const select=document.getElementById('map');for(const c of COURSES){const o=document.createElement('option');o.value=c.id;o.textContent=c.name;select.append(o);}select.value='dune';
function change(){visual?.dispose();const c=COURSES.find(c=>c.id===select.value);match=new MinigolfMatch([{id:'one',displayName:'Niko',color:'#f5c55d',characterId:'goblin',bot:false}],()=>.5,[c]);visual=new MinigolfVisuals(s,match.players,shadow);visual.build(c);cam.target.set(0,0,0);cam.radius=65;cam.alpha=-Math.PI/2;cam.beta=.65;time=peak=0;window.probe={match,visual,scene:s,cam};}
select.onchange=change;change();document.getElementById('overview').onclick=()=>{cam.target.set(0,0,0);cam.radius=65;cam.alpha=-Math.PI/2;cam.beta=.65;};document.getElementById('near').onclick=()=>{const b=match.active.ball;cam.target.set(b.x,b.y,b.z-1);cam.radius=6;cam.alpha=Math.PI/2;cam.beta=1.18;};document.getElementById('reset').onclick=()=>change();document.getElementById('shot').onclick=()=>{const b=match.active.ball;if(speed(b)<.18){impulse(b,match.active.aim,Number(document.getElementById('power').value)/100);peak=0;}};
e.runRenderLoop(()=>{const dt=Math.min(.04,e.getDeltaTime()/1000);let remain=dt;while(remain>0){const step=Math.min(remain,1/120);for(const ev of physicsStep(match.players.map(p=>p.ball),match.course,time,step))visual.event(ev,match.players);time+=step;remain-=step;}const b=match.active.ball;peak=Math.max(peak,b.y-b.teeY-.28);visual.update(match.players,match.course,time,[],dt,'one',true);document.getElementById('readout').textContent=`${match.course.name} · ${speed(b).toFixed(1)} m/s · dislivello dal tee ${Math.max(0,peak*100).toFixed(0)} cm · ${b.done?'IMBUCATA':b.grounded?'sul prato':'in aria'}`;s.render();});window.addEventListener('resize',()=>e.resize());window.ready=true;
</script></html>
