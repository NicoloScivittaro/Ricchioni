<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terminal 2.3 — verifiche</title><link rel="icon" href="data:,"><style>body{margin:0;background:#101820;color:#e8eff5;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{margin:0 0 8px}p{line-height:1.6;color:#b6c8d4}figure{margin:24px 0}img{width:100%;height:auto;border-radius:10px}figcaption{margin:8px 0;color:#b6c8d4}b{color:#8de0bc}</style><main><h1>Terminal 2.3</h1><p>Campione RTX 3050, cinque visuali a 1280×720: <b>42,6 → 59,3 FPS</b>. Ingresso completo locale: <b>5,75 → 4,20 secondi</b>. Misure brevi nelle stesse condizioni, senza garanzie per ogni dispositivo o scena.</p><figure><img src="split-screen.png"><figcaption>Cinque visuali e indicatore PROTETTO compatto.</figcaption></figure><figure><img src="weapon-lighting.png"><figcaption>M4A1 nella cabina: materiali rifiniti e dettagli dell’arma più leggibili.</figcaption></figure><figure><img src="terminal-signs.png"><figcaption>Terminal conserva la geometria e i cartelloni riparati.</figcaption></figure><figure><img src="sniper-ads.png"><figcaption>Sniper ADS 4× conservato.</figcaption></figure><p>Sei armi con la sola Ray Gun rossa. Collisioni, due accessi all’aereo e gameplay invariati.</p></main></html>
