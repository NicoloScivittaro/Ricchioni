# Render Blueprint: crea il server WebSocket su Render (piano free).
# Su Render: "New > Blueprint" e seleziona questo repo.
services:
  - type: web
    name: ricchioni-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
